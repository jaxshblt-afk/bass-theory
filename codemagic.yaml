workflows:
  android-debug:
    name: Bass Theory Android
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:
      - name: Preparar projeto Android
        script: |
          flutter create --platforms=android .
          python3 -c "p='android/app/src/main/AndroidManifest.xml'; s=open(p).read(); s=s.replace('<manifest ', '<manifest '); s=s.replace('>', '>\\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>', 1); open(p,'w').write(s)"

      - name: Instalar dependências
        script: |
          flutter pub get

      - name: Gerar APK
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk